# ================================================================
# 🔑 用户敏感与自定义配置文件 (User Secrets & Custom Configuration)
# 说明：本项目已将所有需用户手动填写的账号、密码与密钥抽离在此。
# ================================================================

custom:
  # 1. MySQL 数据库连接配置
  datasource:
    host: localhost
    port: 3306
    database: zero_to_tech
    username: 你的数据库用户名字
    password: 你的数据库密码

  # 2. DeepSeek 大模型 API 密钥 (格式通常为 sk-xxxx)
  ai:
    api-key: "你的API密钥"
